<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Title</title>
  <link rel="stylesheet" href="../../assets/ifs-cloud.css">
  <script src="../../assets/ifs-cloud.js"></script>
</head>
<!-- Copy to mockups/<name>/, add <script src="config.js"></script> before ifs-cloud.js, set data-nav to a navigator item id from config.js -->
<body data-nav="template">
<main class="ifs-page">

  <div class="ifs-page-header">
    <div class="ifs-breadcrumb"><a href="../examples/lobby.html"><i data-icon="home"></i></a><i data-icon="chevron-right"></i><span>Module</span><i data-icon="chevron-right"></i><span>Page Title</span></div>
    <div class="ifs-title-row">
      <h1>Page Title</h1>
      <button class="fav" title="Add to favorites"><i data-icon="star" class="lg"></i></button>
    </div>
    <div class="ifs-commandbar">
      <button class="btn"><i data-icon="plus"></i>New</button>
      <button class="btn"><i data-icon="edit"></i>Edit</button>
      <button class="btn"><i data-icon="trash"></i>Delete</button>
      <div class="spacer"></div>
      <button class="btn icon" title="Refresh"><i data-icon="refresh"></i></button>
    </div>
  </div>

  <div class="ifs-page-body">
    <!-- Paste components from components.html here -->
    <div class="ifs-group">
      <div class="ifs-group-header"><i data-icon="chevron-down" class="chev"></i>General</div>
      <div class="ifs-group-body">
        <div class="ifs-fields cols-4">
          <div class="ifs-field"><label>Field</label><div class="ifs-field-value">Value</div></div>
        </div>
      </div>
    </div>
  </div>

</main>

</html>
